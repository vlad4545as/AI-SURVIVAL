      - name: Build APK
        run: |
          cd AI_SURVIVAL_Android_CloudBuild
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-SURVIVAL-v1.8-APK
          path: AI_SURVIVAL_Android_CloudBuild/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
